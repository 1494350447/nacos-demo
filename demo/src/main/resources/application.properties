spring.application.name=demo
server.port=8080

# ---------------- Nacos 连接信息 ----------------
spring.cloud.nacos.server-addr=127.0.0.1:8848
spring.cloud.nacos.username=nacos
spring.cloud.nacos.password=nacos

# ---------------- 服务注册与发现 ----------------
spring.cloud.nacos.discovery.server-addr=127.0.0.1:8848
spring.cloud.nacos.discovery.group=DEFAULT_GROUP
# Nacos 3.x 的默认命名空间 id 是字面量 public，显式指定避免客户端回落到空命名空间
spring.cloud.nacos.discovery.namespace=public

# ---------------- 配置中心 ----------------
# 启动时从 Nacos 拉取 demo.yaml；用 optional: 前缀保证配置不存在时也能正常启动
spring.cloud.nacos.config.server-addr=127.0.0.1:8848
spring.cloud.nacos.config.namespace=public
spring.config.import=optional:nacos:demo.yaml?group=DEFAULT_GROUP&refreshEnabled=true

# ---------------- Actuator ----------------
management.endpoints.web.exposure.include=health,info,refresh,env
management.endpoint.health.show-details=always
